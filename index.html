<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeRank - Discover Amazing Cafes Nearby</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-coffee"></i>
                    <h1>CafeRank</h1>
                </div>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search cafes..." class="search-input">
                    <button id="searchBtn" class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="location-btn">
                    <button id="getLocationBtn" class="btn-primary">
                        <i class="fas fa-location-dot"></i>
                        Find Nearby
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Cafes Nearby</h2>
                    <div class="filter-controls">
                        <select id="sortSelect" class="filter-select">
                            <option value="distance">Sort by Distance</option>
                            <option value="rating">Sort by Rating</option>
                            <option value="price">Sort by Price</option>
                        </select>
                        <div class="price-filter">
                            <label>Price Range:</label>
                            <div class="price-buttons">
                                <button class="price-btn active" data-price="all">All</button>
                                <button class="price-btn" data-price="$">$</button>
                                <button class="price-btn" data-price="$$">$$</button>
                                <button class="price-btn" data-price="$$$">$$$</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="cafe-list" id="cafeList">
                    <!-- Cafe cards will be dynamically inserted here -->
                </div>
            </aside>

            <!-- Map Container -->
            <div class="map-container">
                <div id="map" class="map"></div>
                <div class="map-controls">
                    <button id="centerMapBtn" class="map-control-btn">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                    <button id="toggleViewBtn" class="map-control-btn">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Cafe Detail Modal -->
        <div id="cafeModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="cafeDetails">
                    <!-- Cafe details will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
